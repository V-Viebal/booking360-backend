name: Booking360 Backend Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking360-backend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Use a repository-owned package name that is created and linked by this
  # workflow. The previous package name was created outside this repository's
  # Actions access boundary, so a valid job token could publish but Coolify
  # could not pull it.
  IMAGE_REPO: ghcr.io/v-viebal/booking360-backend-runtime
  INFISICAL_API_URL: https://keys.hmz.one
  INFISICAL_ORIGIN_IP: ''
  INFISICAL_PROJECT_SLUG: booking360-d-x-db
  EXPECTED_GITHUB_REPOSITORY: V-Viebal/booking360-backend
  COMPOSE_FILE_LOCATION: /compose.yaml
  COMPOSE_START_COMMAND: bash scripts/coolify_ghcr_start.sh

jobs:
  validate:
    name: Validate source and deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_GITHUB_REPOSITORY}"
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/staging) ;;
            *) echo "Unsupported release ref: ${GITHUB_REF}" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Booking360.slnx

      - name: Build backend
        run: dotnet build Booking360.slnx --no-restore --configuration Release /p:OpenApiGenerateDocuments=false

      - name: Validate shell and Compose contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/coolify_ghcr_start.sh
          bash -n scripts/coolify_registry_credentials.sh
          bash -n scripts/deploy_coolify_application.sh
          node --check scripts/reconcile_coolify_registry_credentials.mjs
          touch .env
          trap 'rm -f .env' EXIT
          docker compose -f compose.yaml config -q

  build:
    name: Build immutable image on GitHub-hosted runner
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_digest: ${{ steps.image.outputs.image_digest }}
      target_role: ${{ steps.target.outputs.role }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve target role
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${GITHUB_REF}" in
            refs/heads/main) role=production ;;
            refs/heads/staging) role=staging ;;
            *) echo "Unsupported release ref: ${GITHUB_REF}" >&2; exit 1 ;;
          esac
          echo "role=${role}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ steps.target.outputs.role }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=booking360-backend-${{ steps.target.outputs.role }}
          cache-to: type=gha,mode=max,scope=booking360-backend-${{ steps.target.outputs.role }}
          provenance: mode=max
          sbom: true

      - name: Resolve exact registry digest
        id: image
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${BUILD_DIGEST}" == sha256:* ]] || {
            echo "Build did not return an OCI digest." >&2
            exit 1
          }
          echo "image_digest=${BUILD_DIGEST}" >>"${GITHUB_OUTPUT}"
          echo "image_ref=${IMAGE_REPO}@${BUILD_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Verify the immutable image is pullable with the repository token
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker_config="$(mktemp -d)"
          trap 'docker --config "${docker_config}" logout ghcr.io >/dev/null 2>&1 || true; rm -rf "${docker_config}"' EXIT
          printf '%s' "${GHCR_TOKEN}" |
            docker --config "${docker_config}" login ghcr.io \
              --username "${GITHUB_ACTOR}" --password-stdin >/dev/null
          docker --config "${docker_config}" pull "${IMAGE_REF}" >/dev/null
          docker --config "${docker_config}" image inspect "${IMAGE_REF}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            grep -Fx -- "${IMAGE_REF}" >/dev/null

      - name: Verify the package is not anonymously readable
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          image_repo_path="${IMAGE_REPO#ghcr.io/}"
          anonymous_token="$(
            curl --fail --silent --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_repo_path}:pull" |
              jq -r '.token // empty' || true
          )"
          if [[ -z "${anonymous_token}" ]]; then
            echo "GHCR denied an anonymous pull token as expected."
            exit 0
          fi
          status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${anonymous_token}" \
              --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${image_repo_path}/manifests/${IMAGE_DIGEST}"
          )"
          case "${status}" in
            401|403|404) ;;
            200)
              echo "GHCR image is anonymously readable; expected a private package." >&2
              exit 1
              ;;
            *) echo "Unexpected anonymous GHCR response: HTTP ${status}" >&2; exit 1 ;;
          esac

  deploy:
    name: Deploy exact digest through locked Coolify Application
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ needs.build.outputs.target_role }}
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      RELEASE_SHA: ${{ github.sha }}
      INFISICAL_ENV_SLUG: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      INFISICAL_IDENTITY_ID: ${{ github.ref_name == 'main' && '4fe0f200-7d25-4dab-a594-235cb857cc7c' || '567d962e-e8e6-4773-9301-0e86904c7ac3' }}
      INFISICAL_SECRET_PATH: /github-actions
      INFISICAL_RUNTIME_PATH: ${{ github.ref_name == 'main' && '/backend/production' || '/backend/staging' }}
      COOLIFY_PROJECT_UUID: b4sha277lbvm1fbwnmeucz8d
      COOLIFY_ENVIRONMENT_UUID: ${{ github.ref_name == 'main' && 'b2lr47qjubg8bocj438u3brg' || 'gundabtcsxpr20csuh3zxdym' }}
      COOLIFY_ENVIRONMENT_NAME: ${{ needs.build.outputs.target_role }}
      COOLIFY_DESTINATION_UUID: bs8ggo84go0wk0kgc80kg0ww
      COOLIFY_SERVER_UUID: h0kgwwcg80s40wc8coc4og8w
      COOLIFY_APPLICATION_UUID: ${{ github.ref_name == 'main' && 'cfjkyqovn1xz6vnxfous8e4k' || 'cd0dxocgqg6m0miyruvjd18z' }}
      COOLIFY_APPLICATION_NAME: ${{ github.ref_name == 'main' && 'booking360-backend-production' || 'booking360-backend-staging' }}
      COOLIFY_PUBLIC_DOMAIN: ${{ github.ref_name == 'main' && 'http://cfjkyqovn1xz6vnxfous8e4k.100.76.185.111.sslip.io' || 'http://cd0dxocgqg6m0miyruvjd18z.100.76.185.111.sslip.io' }}
      BACKEND_HEALTH_URL: ${{ github.ref_name == 'main' && 'http://cfjkyqovn1xz6vnxfous8e4k.100.76.185.111.sslip.io/health' || 'http://cd0dxocgqg6m0miyruvjd18z.100.76.185.111.sslip.io/health' }}
      HEALTH_URL: ''
      COOLIFY_GIT_BRANCH: ${{ github.ref_name }}
      BOOKING360_BACKEND_COMPOSE_PROJECT: ${{ github.ref_name == 'main' && 'booking360-backend-production' || 'booking360-backend-staging' }}
      BOOKING360_BACKEND_NETWORK_ALIAS: ${{ github.ref_name == 'main' && 'booking360-backend' || 'booking360-backend-staging' }}
      BOOKING360_ALLOW_INITIAL_RELEASE: 'true'
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify the deployment job can pull the immutable image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker_config="$(mktemp -d)"
          trap 'docker --config "${docker_config}" logout ghcr.io >/dev/null 2>&1 || true; rm -rf "${docker_config}"' EXIT
          printf '%s' "${GHCR_TOKEN}" |
            docker --config "${docker_config}" login ghcr.io \
              --username "${GITHUB_ACTOR}" --password-stdin >/dev/null
          docker --config "${docker_config}" pull "${IMAGE_REF}" >/dev/null

      - name: Verify target-scoped contract
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${INFISICAL_PROJECT_SLUG:?INFISICAL_PROJECT_SLUG is not configured}"
          : "${INFISICAL_IDENTITY_ID:?Target OIDC identity is not configured}"
          : "${COOLIFY_PROJECT_UUID:?COOLIFY_PROJECT_UUID is not configured}"
          : "${COOLIFY_ENVIRONMENT_UUID:?COOLIFY_ENVIRONMENT_UUID is not configured}"
          : "${COOLIFY_DESTINATION_UUID:?COOLIFY_DESTINATION_UUID is not configured}"
          : "${COOLIFY_SERVER_UUID:?COOLIFY_SERVER_UUID is not configured}"
          : "${COOLIFY_APPLICATION_UUID:?Target Coolify Application is not configured}"
          : "${COOLIFY_APPLICATION_NAME:?Target Coolify Application name is not configured}"
          : "${COOLIFY_PUBLIC_DOMAIN:?Target public domain is not configured}"
          : "${BACKEND_HEALTH_URL:?Backend health URL is not configured}"
          [[ "${COOLIFY_APPLICATION_UUID}" != UNCONFIGURED_* ]] || {
            echo "The target Coolify Application is intentionally not configured yet." >&2
            exit 1
          }

      - name: Verify GitHub OIDC claims without exposing the token
        shell: bash
        env:
          EXPECTED_OIDC_SUBJECT: repo:${{ github.repository }}:environment:${{ needs.build.outputs.target_role }}
        run: |
          set -Eeuo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is missing}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is missing}"
          oidc_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2FV-Viebal" |
              jq -r '.value // empty'
          )"
          : "${oidc_token:?GitHub did not return an OIDC token}"
          claims="$(
            printf '%s' "${oidc_token}" |
              python3 -c '
          import base64, json, sys
          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({"sub": claims.get("sub"), "aud": claims.get("aud")}))
          '
          )"
          actual_subject="$(jq -r '.sub // empty' <<<"${claims}")"
          actual_audience="$(jq -r '.aud // empty' <<<"${claims}")"
          echo "GitHub OIDC subject: ${actual_subject}"
          echo "GitHub OIDC audience: ${actual_audience}"
          test "${actual_subject}" = "${EXPECTED_OIDC_SUBJECT}"
          test "${actual_audience}" = "https://github.com/V-Viebal"
          unset oidc_token

      - name: Route Infisical API through its origin when configured
        if: ${{ env.INFISICAL_ORIGIN_IP != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${INFISICAL_ORIGIN_IP} keys.hmz.one" | sudo tee -a /etc/hosts >/dev/null

      - name: Fetch target-scoped Coolify credentials from Infisical
        uses: Infisical/secrets-action@a663da43e1541832614bfd9dcf9ab67381ea2b98 # v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/V-Viebal
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}

      - name: Fetch target runtime settings from Infisical
        uses: Infisical/secrets-action@a663da43e1541832614bfd9dcf9ab67381ea2b98 # v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/V-Viebal
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: ${{ env.INFISICAL_RUNTIME_PATH }}

      - name: Deploy, poll, verify, and roll back on failure
        id: deploy
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL was not provided by Infisical}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN was not provided by Infisical}"
          bash scripts/deploy_coolify_application.sh

      - name: Emit secret-free deployment receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          receipt="$(
            jq -cn \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg revision "${GITHUB_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg role "${COOLIFY_ENVIRONMENT_NAME}" \
              --arg image "${IMAGE_REF}" \
              --arg application "${COOLIFY_APPLICATION_UUID}" \
              --arg deployment "${{ steps.deploy.outputs.deployment_uuid }}" \
              --arg previous "${{ steps.deploy.outputs.previous_image }}" \
              --arg runtime_image_id "${{ steps.deploy.outputs.runtime_image_id }}" \
              --arg domain "${COOLIFY_PUBLIC_DOMAIN}" \
              '{
                repository:$repository,
                revision:$revision,
                workflow_run_id:$run_id,
                target_role:$role,
                image:$image,
                coolify_application_uuid:$application,
                deployment_uuid:$deployment,
                previous_image:$previous,
                runtime_image_id:$runtime_image_id,
                domain:$domain,
                health:"verified",
                sbom:"published",
                provenance:"published",
                registry_credentials:"cleared_by_cleanup_job"
              }'
          )"
          printf '%s\n' "${receipt}" | tee -a "${GITHUB_STEP_SUMMARY}"

  registry_credentials_cleanup:
    name: Independently clear temporary GHCR credentials
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      INFISICAL_ENV_SLUG: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      INFISICAL_IDENTITY_ID: ${{ github.ref_name == 'main' && '4fe0f200-7d25-4dab-a594-235cb857cc7c' || '567d962e-e8e6-4773-9301-0e86904c7ac3' }}
      INFISICAL_SECRET_PATH: /github-actions
      COOLIFY_PROJECT_UUID: b4sha277lbvm1fbwnmeucz8d
      COOLIFY_ENVIRONMENT_UUID: ${{ github.ref_name == 'main' && 'b2lr47qjubg8bocj438u3brg' || 'gundabtcsxpr20csuh3zxdym' }}
      COOLIFY_ENVIRONMENT_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      COOLIFY_DESTINATION_UUID: bs8ggo84go0wk0kgc80kg0ww
      COOLIFY_SERVER_UUID: h0kgwwcg80s40wc8coc4og8w
      COOLIFY_APPLICATION_UUID: ${{ github.ref_name == 'main' && 'cfjkyqovn1xz6vnxfous8e4k' || 'cd0dxocgqg6m0miyruvjd18z' }}
      COOLIFY_APPLICATION_NAME: ${{ github.ref_name == 'main' && 'booking360-backend-production' || 'booking360-backend-staging' }}
      COOLIFY_PUBLIC_DOMAIN: ${{ github.ref_name == 'main' && 'http://cfjkyqovn1xz6vnxfous8e4k.100.76.185.111.sslip.io' || 'http://cd0dxocgqg6m0miyruvjd18z.100.76.185.111.sslip.io' }}
      COOLIFY_GIT_BRANCH: ${{ github.ref_name }}
      EXPECTED_GITHUB_REPOSITORY: V-Viebal/booking360-backend
    steps:
      - name: Checkout exact cleanup implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify cleanup target exists
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${INFISICAL_PROJECT_SLUG:?INFISICAL_PROJECT_SLUG is not configured}"
          : "${INFISICAL_IDENTITY_ID:?Target OIDC identity is not configured}"
          : "${COOLIFY_PROJECT_UUID:?COOLIFY_PROJECT_UUID is not configured}"
          : "${COOLIFY_ENVIRONMENT_UUID:?COOLIFY_ENVIRONMENT_UUID is not configured}"
          : "${COOLIFY_DESTINATION_UUID:?COOLIFY_DESTINATION_UUID is not configured}"
          : "${COOLIFY_SERVER_UUID:?COOLIFY_SERVER_UUID is not configured}"
          : "${COOLIFY_APPLICATION_UUID:?Target Coolify Application is not configured}"
          [[ "${COOLIFY_APPLICATION_UUID}" != UNCONFIGURED_* ]] || {
            echo "Cleanup target is intentionally not configured yet." >&2
            exit 1
          }

      - name: Route Infisical API through its origin when configured
        if: ${{ env.INFISICAL_ORIGIN_IP != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${INFISICAL_ORIGIN_IP} keys.hmz.one" | sudo tee -a /etc/hosts >/dev/null

      - name: Fetch target-scoped cleanup credentials
        uses: Infisical/secrets-action@a663da43e1541832614bfd9dcf9ab67381ea2b98 # v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/V-Viebal
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}

      - name: Delete and verify all temporary registry rows
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL was not provided by Infisical}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN was not provided by Infisical}"
          bash scripts/coolify_registry_credentials.sh clear
          node scripts/reconcile_coolify_registry_credentials.mjs \
            --application "${COOLIFY_APPLICATION_UUID}" \
            --expected-name "${COOLIFY_APPLICATION_NAME}" \
            --expected-project "${COOLIFY_PROJECT_UUID}" \
            --expected-environment "${COOLIFY_ENVIRONMENT_NAME}" \
            --expected-environment-uuid "${COOLIFY_ENVIRONMENT_UUID}" \
            --expected-destination "${COOLIFY_DESTINATION_UUID}" \
            --expected-server "${COOLIFY_SERVER_UUID}" \
            --expected-branch "${COOLIFY_GIT_BRANCH}" \
            --expected-repository "${EXPECTED_GITHUB_REPOSITORY}" \
            --key BOOKING360_BACKEND_GHCR_USERNAME \
            --key BOOKING360_BACKEND_GHCR_TOKEN \
            --apply
